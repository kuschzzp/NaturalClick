<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Rich Editor Fixture</title>
  </head>
  <body>
    <main>
      <h1>公告编辑</h1>
      <div class="toolbar" role="toolbar" aria-label="编辑工具">
        <button type="button" aria-label="加粗">B</button>
        <button type="button" aria-label="插入链接">链接</button>
      </div>
      <div id="editor" contenteditable="true" role="textbox" aria-label="公告正文"></div>
      <button type="button">发布</button>
    </main>
  </body>
</html>
